name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            asset_name: lz-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            asset_name: lz-linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools (cargo-deb & cargo-generate-rpm)
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo binstall --no-confirm cargo-deb cargo-generate-rpm

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Build .deb and .rpm packages
        run: |
          mkdir -p dist
          cp target/release/lz "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"
          cargo deb --no-build --no-strip -o dist/
          cargo generate-rpm -o dist/
          (cd dist && sha256sum "${{ matrix.asset_name }}" *.deb *.rpm > "${{ matrix.arch }}.sha256")
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/lz-linux-*
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt
